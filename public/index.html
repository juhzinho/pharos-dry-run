<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharos Dry Run</title>
  <meta name="description" content="Simulate a Pacific transaction in 3D before anything is signed. Read-only." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,560;1,9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    :root {
      --ink: #e8f3ff; --muted: #9aafc6; --cyan: #3ee0c5; --blue: #8eb6ff; --coral: #ff6d7e; --amber: #f2b85a;
      --glass: rgba(8, 14, 24, .62); --line: rgba(255,255,255,.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: var(--ink); background: #071018; font: 16px/1.5 Outfit, system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; }
    .wash { position: fixed; inset: 0; z-index: 1; pointer-events: none; background:
      radial-gradient(520px 360px at 18% 78%, rgba(62,224,197,.18), transparent 62%),
      radial-gradient(480px 340px at 82% 12%, rgba(142,182,255,.16), transparent 64%);
      animation: drift 16s ease-in-out infinite alternate; }
    header { position: fixed; z-index: 3; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 16px; padding: 18px 28px; }
    .brand { color: inherit; text-decoration: none; letter-spacing: .16em; font-size: 13px; font-weight: 600; }
    .brand b { color: var(--cyan); }
    .lang { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .lang button { border: 0; background: transparent; color: var(--muted); padding: 7px 12px; cursor: pointer; font: 600 12px Outfit, sans-serif; }
    .lang button.on { background: #f4f0e6; color: #102033; }
    main { position: relative; z-index: 2; min-height: 100vh; display: grid; grid-template-columns: 1.15fr .85fr; gap: 28px; align-items: center; padding: 88px 32px 28px; }
    .hero { animation: rise .8s cubic-bezier(.16,.8,.2,1) both; max-width: 34rem; }
    .kicker { margin: 0 0 10px; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: var(--cyan); }
    h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 560; font-style: italic; font-size: clamp(52px, 7vw, 92px); line-height: .9; letter-spacing: -.03em; }
    .lead { color: var(--muted); max-width: 38ch; margin: 16px 0 0; }
    .legend { display: flex; gap: 14px; list-style: none; padding: 0; margin: 22px 0 0; color: var(--muted); font-size: 13px; }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dock { background: var(--glass); border: 1px solid var(--line); border-radius: 28px; padding: 16px 18px; max-height: calc(100vh - 112px); overflow: auto; backdrop-filter: blur(18px); box-shadow: 0 24px 70px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18); animation: rise .9s .08s cubic-bezier(.16,.8,.2,1) both; }
    .samples, .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .samples button, select, input { font: inherit; color: var(--ink); }
    .samples button { border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--muted); border-radius: 999px; padding: 8px 12px; cursor: pointer; transition: translate .2s ease, background .2s ease, color .2s ease; }
    .samples button.on { background: #f4f0e6; color: #122033; translate: 0 -1px; }
    label { display: block; margin: 8px 0 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    select, input { width: 100%; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(5,10,18,.55); }
    .row > * { flex: 1; min-width: 120px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn { border: 0; border-radius: 999px; padding: 12px 16px; cursor: pointer; font: 600 14px Outfit, sans-serif; transition: translate .16s ease, filter .16s ease; }
    .btn.go { background: var(--cyan); color: #06221c; }
    .btn.send { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn:hover { translate: 0 -2px; }
    .btn:active { translate: 0 1px; }
    .btn:disabled { opacity: .55; }
    .hint, .status { color: var(--muted); font-size: 13px; min-height: 1.2em; }
    .status.err { color: var(--coral); }
    .status.busy { background-image: linear-gradient(90deg, transparent, rgba(62,224,197,.25), transparent); background-size: 160px 100%; animation: shine 1s linear infinite; border-radius: 999px; }
    #out { margin-top: 8px; overflow: hidden; }
    #out[hidden] { display: none; }
    .verdict { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
    .verdict.pass { color: var(--cyan); }
    .verdict.revert { color: var(--coral); }
    .verdict.gas { color: var(--amber); }
    .line { margin: 8px 0; animation: rise .5s cubic-bezier(.16,.8,.2,1) both; }
    .diff { display: grid; gap: 6px; margin: 10px 0 4px; }
    .diff-row { display: grid; grid-template-columns: 1.15fr .7fr auto; gap: 8px; align-items: baseline; font-size: 13px; }
    .diff-row span:first-child { color: var(--muted); }
    .diff-row b { font-weight: 600; }
    .diff-row b.up { color: var(--cyan); }
    .diff-row b.down { color: var(--coral); }
    .diff-row b.flat { color: var(--muted); font-weight: 500; }
    .btn.send:disabled { cursor: not-allowed; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; color: #c9d8ea; }
    @keyframes rise { from { opacity: 0; translate: 0 16px; } to { opacity: 1; translate: 0 0; } }
    @keyframes drift { from { translate: 0 0; } to { translate: 0 -18px; } }
    @keyframes shine { from { background-position: -160px 0; } to { background-position: 220px 0; } }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; align-items: start; padding: 88px 16px 24px; }
      h1 { font-size: 56px; }
      #stage { opacity: .85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wash, .hero, .dock, .line, .status.busy { animation: none; }
      .btn:hover, .samples button.on { translate: 0 0; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="wash" aria-hidden="true"></div>
  <header>
    <a class="brand" href="/"><b>PHAROS</b> DRY RUN</a>
    <div class="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button></div>
  </header>
  <main>
    <section class="hero">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <ul class="legend">
        <li><i style="background:#3ee0c5"></i><span id="legPass"></span></li>
        <li><i style="background:#ff6d7e"></i><span id="legRevert"></span></li>
        <li><i style="background:#f2b85a"></i><span id="legGas"></span></li>
      </ul>
    </section>
    <section class="dock">
      <form id="form">
        <div class="samples" id="samples">
          <button type="button" data-sample="pass">pass</button>
          <button type="button" data-sample="revert">revert</button>
          <button type="button" data-sample="gas">gas</button>
          <button type="button" data-sample="custom">custom</button>
        </div>
        <p class="hint" id="hint"></p>
        <div class="row">
          <div>
            <label for="kind" id="kindL"></label>
            <select id="kind"><option value="transfer">transfer</option><option value="approve">approve</option><option value="native">native</option></select>
          </div>
          <div id="tokenWrap">
            <label for="token">Token</label>
            <select id="token"><option>USDC</option><option>WPROS</option><option>LINK</option><option>WETH</option></select>
          </div>
          <div>
            <label for="amount" id="amountL"></label>
            <input id="amount" inputmode="decimal" value="1" />
          </div>
        </div>
        <label for="from" id="fromL"></label>
        <input class="mono" id="from" spellcheck="false" value="0x15dDce897D76ac39c188AdE4D353711A60395315" />
        <label for="to" id="toL"></label>
        <input class="mono" id="to" spellcheck="false" value="0x000000000000000000000000000000000000dEaD" />
        <div class="actions">
          <button class="btn go" id="go" type="submit"></button>
          <button class="btn send" id="send" type="button" disabled></button>
        </div>
      </form>
      <p class="status" id="status"></p>
      <div id="out" hidden>
        <p class="verdict" id="head"></p>
        <div id="lines"></div>
      </div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
